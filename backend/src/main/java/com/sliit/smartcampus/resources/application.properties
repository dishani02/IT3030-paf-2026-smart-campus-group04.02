# ===============================
# DATABASE CONNECTION SETTINGS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/SmartCampusOperationsHub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# Automatically update the database schema based on your entity classes
spring.jpa.hibernate.ddl-auto=update

# Show the generated SQL in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specify the MySQL Dialect (MySQL 8 is the modern default)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
